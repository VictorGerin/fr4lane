[pytest]
testpaths = tests
addopts = -ra
markers =
    tools: precisa do Yosys e do Icarus Verilog (iverilog/vvp)
    slow: roda o fluxo completo (síntese, placement e roteamento); alguns segundos cada
    kicad: precisa do kicad-cli (DRC)
    ui: precisa do Selenium e do Chrome (teste da página do fpedit)
    spice: precisa do ngspice (simulação analógica das células)
