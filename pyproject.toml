[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fr4lane"
version = "0.1.0"
description = "Verilog -> Yosys -> células de componentes discretos (CMOS, RTL, relé) -> placement -> roteamento -> projeto KiCad"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Victor Lacerda" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/VictorGerin/fr4lane"

[project.optional-dependencies]
# compila a busca do roteador e o anelamento do placement (sem ele, o mesmo resultado, mais devagar)
fast = ["numba"]
test = ["pytest", "selenium"]

[project.scripts]
fr4lane = "fr4lane.__main__:main"
fr4lane-pld = "fr4lane.pld.cli:main"
fr4lane-fpedit = "fr4lane.fpedit:main"
fr4lane-drc = "fr4lane.drc:main"
fr4lane-system = "fr4lane.system:main"
fr4lane-cellsim = "fr4lane.cellsim:main"
fr4lane-backplane = "fr4lane.backplane:main"

[tool.setuptools]
packages = ["fr4lane"]

[tool.setuptools.package-data]
# a página do editor e as famílias de células (cmos, rtl, relay) vão junto com o pacote
fr4lane = ["fpedit.html", "lib/footprints.json", "lib/*/*.json", "lib/*/cells/*/*", "lib/*/spice/*"]
