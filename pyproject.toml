[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbflow"
version = "0.1.0"
description = "Verilog -> Yosys -> células de componentes discretos (CMOS, RTL, relé) -> placement -> roteamento -> projeto KiCad"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Lacerda" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/VictorGerin/pcbflow"

[project.optional-dependencies]
# compila a busca do roteador e o anelamento do placement (sem ele, o mesmo resultado, mais devagar)
fast = ["numba"]
test = ["pytest", "selenium"]

[project.scripts]
pcbflow = "pcbflow.__main__:main"
pcbflow-fpedit = "pcbflow.fpedit:main"
pcbflow-drc = "pcbflow.drc:main"

[tool.setuptools]
packages = ["pcbflow"]

[tool.setuptools.package-data]
# a página do editor e as famílias de células (cmos, rtl, relay) vão junto com o pacote
pcbflow = ["fpedit.html", "lib/footprints.json", "lib/*/*.json", "lib/*/cells/*/*"]
